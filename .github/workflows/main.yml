name: CI for main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:

  abi:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04
      task: checkLegacyAbi

  lint:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: lintKotlin

  baseline:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: checkCompilerBaseline

  metadata:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: compileCommonMainKotlinMetadata

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            task: test corpus
          - os: ubuntu-24.04-arm
            task: jsTest
          - os: ubuntu-24.04-arm
            task: wasmJsTest
          - os: macos-latest
            task: macosArm64Test
          - os: macos-latest
            task: iosSimulatorArm64Test
          - os: ubuntu-latest
            task: linuxX64Test
          - os: windows-latest
            task: mingwX64Test
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ${{ matrix.os }}
      task: ${{ matrix.task }}

  lint-example:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: -p example lintKotlin

  compile-example:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: macos-latest
      task: -p example :android:assembleDebug
