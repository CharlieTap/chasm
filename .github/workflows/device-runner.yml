name: Android device test workflow 📱

on:
  workflow_call:
    inputs:
      api-level:
        type: number
        description: 'The Android API level of the emulator'
        required: true
      module:
        type: string
        description: 'The Gradle project whose device tests run, e.g. :chasm-jit'
        required: true
      name:
        type: string
        description: 'A path-safe name for the uploaded reports'
        required: true

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:

      - name: Clone Repo
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-strict-match: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble test APK
        run: ./gradlew ${{ inputs.module }}:assembleAndroidDeviceTest

      - name: Run device tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew ${{ inputs.module }}:connectedAndroidDeviceTest || (adb logcat -d > logcat.txt; exit 1)

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-${{ inputs.name }}-api-${{ inputs.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            logcat.txt
